name: gtds # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: "1.0.1" # just for humans, typically '1.2+git' or '1.3.2'
summary: Get the size of your directory fast # 79 char long summary
description: |
  This actully lets you get your directory size by just running some commands.
  I know some very popular existing package there but this gives faster result on ubuntu as well as on windows.

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: classic # use 'strict' once you have the right plugs and slots

apps:
  gtds:
    command: gtds

parts:
  gtds:
    source: ./dist
    plugin: dump
    organize:
      "gtds/gtds": bin/
